# Missing in Dograh: docker-compose-local.yaml publishes Postgres/Redis on all interfaces at 5432/6379, which collides with (and
# exposes) other containers on a shared host. This moves them to loopback ports.
#   docker compose -p sync-voice-dograh -f docker-compose-local.yaml -f synchronize/compose.dev-ports.yaml up -d postgres redis minio
services:
  postgres:
    ports: !override
      - "127.0.0.1:56432:5432"
  redis:
    ports: !override
      - "127.0.0.1:56379:6379"
  minio:
    ports: !override
      - "127.0.0.1:56900:9000"
      - "127.0.0.1:56901:9001"
